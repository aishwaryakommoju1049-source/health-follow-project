[project]
name = "mediagent-backend"
version = "0.1.0"
description = "Agentic AI patient follow-up and healthcare assistance system"
requires-python = ">=3.11"

# Runtime and dev dependencies are pinned in requirements.txt /
# requirements-dev.txt, which is what CI installs. This file carries tool
# configuration only.

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "safety: tier-1 red-flag screening. A failure here is a patient-safety regression.",
    "db: requires a live test database.",
    "slow: takes more than a second.",
]
filterwarnings = ["error::DeprecationWarning"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# No global coverage gate yet — a threshold on a near-empty repo just blocks
# merges. Phase 3 enables one on app/services/ only, where the safety-critical
# deterministic code lives. See docs/TESTING_STRATEGY.md §5.

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    # This system processes text typed by patients on real phones, where curly
    # apostrophes and other Unicode lookalikes are normal input. Handling them
    # is the job of normalise() in redflag_rules.py, and the tests must contain
    # the literal characters to prove it works. Flagging them is wrong here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures shadow their own names by design; asserts are the point of tests.
"tests/**" = ["S101", "ARG001"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# Tightened progressively. app/services/ holds the deterministic safety code
# and is held to a higher bar than the rest.
[[tool.mypy.overrides]]
module = "app.services.*"
disallow_any_generics = true
disallow_untyped_calls = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
