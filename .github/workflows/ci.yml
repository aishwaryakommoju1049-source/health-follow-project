name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history to scan past commits
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mediagent
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: mediagent_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mediagent -d mediagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://mediagent:dev@localhost:5433/mediagent_test
      # Deliberately invalid. If any test reaches a real provider, it fails
      # here rather than silently spending money. See TESTING_STRATEGY.md §1.
      ANTHROPIC_API_KEY: not-a-real-key-tests-must-not-call-out

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest -v --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  safety-gate:
    name: Safety suite must pass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Runs the red-flag vignettes on their own, so a failure here is
      # unmistakable in the checks list rather than buried in the full run.
      # No database needed — tier 1 is pure deterministic logic.
      - name: Red-flag screening vignettes
        run: pytest tests/safety -v -m safety
